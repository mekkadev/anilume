[workspace]
members = ["crates/anilume-core"]
resolver = "2"

# src-tauri намеренно не в воркспейсе: оболочка Tauri требует системных
# библиотек вебвью, а ядро должно собираться и тестироваться где угодно,
# включая CI-контейнеры без графики.

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
dashmap = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "gzip",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
