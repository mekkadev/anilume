name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Тесты и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Установить зависимости сайдкара
        run: |
          python -m pip install --upgrade pip
          pip install -e './sidecar[dev]'

      - name: Тесты сайдкара
        run: pytest -q
        working-directory: sidecar

      - name: Тесты ядра
        run: cargo test -p anilume-core --all-targets

      - name: Линт ядра
        run: cargo clippy -p anilume-core --all-targets -- -D warnings

      - name: Форматирование ядра
        run: cargo fmt -p anilume-core --check

      - name: Установить зависимости интерфейса
        run: npm ci

      - name: Типы интерфейса
        run: npm run typecheck

      - name: Сборка интерфейса
        run: npm run build

  bundle:
    name: ${{ matrix.label }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS Silicon
            target: aarch64-apple-darwin
            artifact: anilume-macos-arm64
          - os: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc
            artifact: anilume-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Собрать сайдкар в один файл
        run: |
          python -m pip install --upgrade pip
          pip install './sidecar[dev]'
          python sidecar/build_sidecar.py --triple ${{ matrix.target }}

      - name: Проверить, что сайдкар запускается
        shell: bash
        run: |
          binary=$(ls src-tauri/binaries/anilume-sidecar-${{ matrix.target }}*)
          echo '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}' | "$binary" | tee /dev/stderr | grep -q '"ok":true'

      - name: Кеш сборок ffmpeg
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ matrix.target }}-v1

      - name: Положить ffmpeg в бандл
        run: python scripts/fetch_ffmpeg.py --triple ${{ matrix.target }}

      - name: Проверить, что ffmpeg реально ремуксит HLS
        shell: bash
        run: |
          binary=$(ls src-tauri/binaries/ffmpeg-${{ matrix.target }}*)
          "$binary" -version | head -1
          "$binary" -v error -f lavfi -i testsrc=duration=2:size=320x240:rate=10 \
            -f lavfi -i sine=duration=2 -c:v libx264 -c:a aac \
            -f hls -hls_list_size 0 -hls_segment_filename 'seg%d.ts' probe.m3u8 -y
          "$binary" -v error -i probe.m3u8 -c copy -bsf:a aac_adtstoasc \
            -movflags +faststart probe.mp4 -y
          test -s probe.mp4
          rm -f probe.m3u8 seg*.ts probe.mp4

      - name: Установить зависимости интерфейса
        run: npm ci

      - name: Собрать приложение
        run: npm run tauri build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
