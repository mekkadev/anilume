name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, например v0.1.0
        required: true

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS Silicon
            target: aarch64-apple-darwin
          - os: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}

      - name: Собрать сайдкар в один файл
        run: |
          python -m pip install --upgrade pip
          pip install './sidecar[dev]'
          python sidecar/build_sidecar.py --triple ${{ matrix.target }}

      - name: Проверить, что сайдкар отвечает
        shell: bash
        run: |
          binary=$(ls src-tauri/binaries/anilume-sidecar-${{ matrix.target }}*)
          echo '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}' | "$binary" | grep -q '"ok":true'

      - name: Кеш сборок ffmpeg
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ matrix.target }}-v1

      - name: Положить ffmpeg в бандл
        run: python scripts/fetch_ffmpeg.py --triple ${{ matrix.target }}

      - name: Проверить, что ffmpeg реально ремуксит HLS
        shell: bash
        run: |
          binary=$(ls src-tauri/binaries/ffmpeg-${{ matrix.target }}*)
          "$binary" -version | head -1

          encoders=$("$binary" -hide_banner -encoders 2>/dev/null)
          if grep -q " libx264 " <<< "$encoders"; then
            encoder=libx264
          elif grep -q " libopenh264 " <<< "$encoders"; then
            encoder=libopenh264
          else
            echo "В сборке нет ни libx264, ни libopenh264 — проверить ремукс нечем"
            exit 1
          fi
          echo "Проверяем через $encoder"

          "$binary" -v error -f lavfi -i testsrc=duration=2:size=320x240:rate=10 \
            -f lavfi -i sine=duration=2 -c:v "$encoder" -c:a aac \
            -f hls -hls_list_size 0 -hls_segment_filename 'seg%d.ts' probe.m3u8 -y
          "$binary" -v error -i probe.m3u8 -c copy -bsf:a aac_adtstoasc \
            -movflags +faststart probe.mp4 -y
          test -s probe.mp4
          "$binary" -v error -i probe.mp4 -f null -
          rm -f probe.m3u8 seg*.ts probe.mp4

      - name: Установить зависимости интерфейса
        run: npm ci

      - name: Собрать приложение
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Собрать список файлов
        id: collect
        shell: bash
        run: |
          mkdir -p artifacts
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$bundle" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          if-no-files-found: error
          path: artifacts/*

  publish:
    name: Опубликовать релиз
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Показать, что собрали
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: anilume ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            Десктоп-клиент для просмотра аниме с русской озвучкой.

            | файл | для чего |
            | --- | --- |
            | `.dmg` | macOS 11+ на Apple Silicon |
            | `.msi` или `.exe` | Windows 10/11 x64 |

            **Сборки не подписаны.** macOS положит приложение в карантин:

            ```bash
            xattr -dr com.apple.quarantine /Applications/anilume.app
            ```

            В Windows SmartScreen нужно нажать «Подробнее» → «Выполнить в любом случае».

            Скачивание серий требует установленного ffmpeg — он намеренно не входит
            в сборку. Синхронизация с Shikimori требует своего OAuth-приложения,
            как описано в README.

            Часть источников (AnimeGO, Kodik, Aniboom) отдаёт контент только с IP СНГ.
            AniLibria и Yummy Anime работают без VPN.
